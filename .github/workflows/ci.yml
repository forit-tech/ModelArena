name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # контракт проверяется на Linux, а разработка идёт на Windows — именно на этой паре
    # ловится конверсия переводов строк, из-за которой sha256 в манифесте становятся невалидными
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Целостность зеркала контракта
        # прямая проверка того, что checkout не изменил байты: sha256 частей golden package
        # должны совпасть с манифестом. Без этого шага поломка всплыла бы только у пользователя
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          package = pathlib.Path("contracts/dataset-package/v1/golden/customers_golden.dapkg")
          manifest = json.loads((package / "manifest.json").read_text(encoding="utf-8"))
          bad = [
              part["path"]
              for part in manifest["parts"]
              if hashlib.sha256((package / part["path"]).read_bytes()).hexdigest() != part["sha256"]
          ]
          print("части с несовпавшим sha256:", bad or "нет")
          sys.exit(1 if bad else 0)
          PY

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        working-directory: frontend
        run: npm ci

      - name: Типы
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
